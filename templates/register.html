<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Café Aroma</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-page">

    <div class="login-box">

        <div class="login-logo">
            ☕
        </div>

        <h1>
            Create Account
        </h1>

        <p>
            Join Café Aroma today
        </p>

        <form method="POST"
              action="/register">

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p class="register-text">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
