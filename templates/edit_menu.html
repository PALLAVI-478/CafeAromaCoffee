<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Menu - Café Aroma</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-page">

    <div class="login-box">

        <div class="login-logo">
            ✏️
        </div>

        <h1>
            Edit Menu Item
        </h1>

        <p>
            Update your menu item
        </p>

        <form
            method="POST"
            action="/edit-menu/{{ item['id'] }}"
        >

            <label>
                Food Name
            </label>

            <input
                type="text"
                name="name"
                value="{{ item['name'] }}"
                required
            >

            <label>
                Description
            </label>

            <input
                type="text"
                name="description"
                value="{{ item['description'] }}"
                required
            >

            <label>
                Price
            </label>

            <input
                type="number"
                name="price"
                value="{{ item['price'] }}"
                min="1"
                step="0.01"
                required
            >

            <label>
                Emoji
            </label>

            <input
                type="text"
                name="emoji"
                value="{{ item['emoji'] }}"
                required
            >

            <button type="submit">
                💾 Update Item
            </button>

        </form>

        <a href="/menu"
           class="back-home">

            ← Back to Menu

        </a>

    </div>

</div>

</body>

</html>
