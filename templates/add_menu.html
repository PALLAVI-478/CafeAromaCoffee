<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Menu - Café Aroma</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-page">

    <div class="login-box">

        <div class="login-logo">
            🍴
        </div>

        <h1>
            Add Menu Item
        </h1>

        <p>
            Add a new item
        </p>

        <form method="POST"
              action="/add-menu">

            <label>
                Food Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Example: Cold Coffee"
                required
            >

            <label>
                Description
            </label>

            <input
                type="text"
                name="description"
                placeholder="Food description"
                required
            >

            <label>
                Price
            </label>

            <input
                type="number"
                name="price"
                min="1"
                step="0.01"
                placeholder="150"
                required
            >

            <label>
                Emoji
            </label>

            <input
                type="text"
                name="emoji"
                placeholder="☕"
                required
            >

            <button type="submit">
                ➕ Add Item
            </button>

        </form>

        <a href="/menu"
           class="back-home">

            ← Back to Menu

        </a>

    </div>

</div>

</body>

</html>
