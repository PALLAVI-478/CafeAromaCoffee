{% extends 'base.html' %}{% block title %}Register | Café Aroma.coffee{% endblock %}{% block content %}<section class="auth-page"><div class="auth-art"><div class="big-cup">✦</div><h2>Make it your café.</h2><p>Create an account to order, track and revisit your favourites.</p></div><div class="auth-card"><div class="section-kicker">JOIN AROMA</div><h1>Create account</h1><form method="post" class="form"><label>Name<input name="name" required placeholder="Your name"></label><label>Email<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" minlength="6" required placeholder="At least 6 characters"></label><button class="btn btn-primary full" type="submit">Create account →</button></form><p class="form-note">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div></section>{% endblock %}
